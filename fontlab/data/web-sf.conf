<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>macOS-style mapping with SF fonts Managed by fontlab (web_fonts = sf).
    Sans UI/web names -> SF Pro Text (SF Pro Display at 20pt+, like macOS).
    ui-monospace/Menlo/SF Mono names -> SF Mono; generic monospace untouched (JBM, Nerd icons).
    ui-serif/New York -> New York Small. ui-rounded -> SF Pro Rounded.
    prepend+strong keeps the rest of the list, so CJK/emoji/icons still fall back.
    Liberation Sans is listed because Omarchy's 50-omarchy.conf rewrites sans-serif/system-ui to it.</description>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>.SF NS</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF UI Text</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <!-- macOS switches Text -> Display at 20pt. Only apps that pass a size
       (GTK/Qt/terminals) hit this; Chromium asks without a size. -->
  <match target="pattern">
    <test name="family" qual="first"><string>SF Pro Text</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SFMono-Regular</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Monaco</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ui-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>New York Small</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>New York Small</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ui-rounded</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Rounded</string></edit>
  </match>
  <!-- New York Small ships Bold at weight 180 (= Semibold) and Black at 205 (= Heavy); fix so bold picks Bold. -->
  <match target="scan">
    <test name="family"><string>New York Small</string></test>
    <test name="style"><string>Bold</string></test>
    <edit name="weight" mode="assign"><int>200</int></edit>
  </match>
  <match target="scan">
    <test name="family"><string>New York Small</string></test>
    <test name="style"><string>Bold Italic</string></test>
    <edit name="weight" mode="assign"><int>200</int></edit>
  </match>
  <match target="scan">
    <test name="family"><string>New York Small</string></test>
    <test name="style"><string>Black</string></test>
    <edit name="weight" mode="assign"><int>210</int></edit>
  </match>
  <match target="scan">
    <test name="family"><string>New York Small</string></test>
    <test name="style"><string>Black Italic</string></test>
    <edit name="weight" mode="assign"><int>210</int></edit>
  </match>
</fontconfig>
