<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Chromium only (fontlab, web_fonts = windows): web generics resolve like Chrome on Windows.
     Sorted before 50-omarchy.conf and uses prepend, so Omarchy's CJK/Arabic/emoji
     fallbacks still apply behind these. -->
<fontconfig>
  <match target="pattern"><test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arial</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Times New Roman</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Consolas</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Segoe UI</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arial</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arial</string></edit></match>
</fontconfig>
